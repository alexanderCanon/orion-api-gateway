spring:
    application:
        name: identity-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME:orionticketdb}
        username: ${GLOBAL_DB_USER:app_user}
        password: ${GLOBAL_DB_PASSWORD:AppSecret789}
        driver-class-name: org.postgresql.Driver
        hikari:
            minimum-idle: 10
            connection-init-sql: SET search_path TO ${DB_SCHEMA:identity}
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
        enabled: true
        schemas: ${DB_SCHEMA:identity}
        create-schemas: true
        baseline-on-migrate: true
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:guest}
        password: ${RABBITMQ_PASSWORD:guest}

server:
    port: ${SERVER_PORT:8081}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html

logging:
    level:
        root: INFO
        com.orionticket: DEBUG
        org.springframework.security: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
