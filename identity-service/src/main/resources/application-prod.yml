spring:
    application:
        name: identity-service
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            idle-timeout: 300000
            connection-timeout: 20000
            max-lifetime: 1800000
            keepalive-time: 60000
            validation-timeout: 3000
            pool-name: orion-db-pool
            connection-init-sql: SET search_path TO ${DB_SCHEMA:identity}

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
        enabled: true
        execute-in-transaction: true
        schemas: ${DB_SCHEMA:identity}
        create-schemas: true
        baseline-on-migrate: true
        baseline-version: 0
        validate-on-migrate: true
        locations: classpath:db/migration

    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT:5672}
        # Sin defaults guest/guest en prod: el servicio debe fallar al arrancar
        # si las credenciales de RabbitMQ no están definidas en el entorno.
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASSWORD}

server:
    port: ${SERVER_PORT:8081}
    forward-headers-strategy: native
    shutdown: graceful

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

logging:
    level:
        root: INFO
        com.orionticket: INFO
        org.springframework.security: WARN

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: when-authorized
