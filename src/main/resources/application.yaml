server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: orion-api-gateway

    cloud:
        gateway:
            server:
                webflux:
                    routes: []

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true

logging:
    level:
        root: INFO
        org.springframework.cloud.gateway: INFO
